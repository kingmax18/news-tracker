name: News Tracker & Dashboard

on:
  schedule:
    # Runs every 3 hours (at minute 0)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

# Permissions required to commit repo files and deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Tracker
        run: |
          python tracker.py

      - name: Ensure dashboard data is up to date
        run: |
          mkdir -p docs
          cp output/trending.json docs/trending.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ seen.json docs/trending.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update trending news and dashboard data [skip ci]"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy-dashboard:
    needs: run-tracker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
